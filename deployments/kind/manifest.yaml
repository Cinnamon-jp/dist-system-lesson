apiVersion: v1
kind: Namespace
metadata:
  name: dist-system
---
apiVersion: v1
kind: Service
metadata:
  name: dist-kvs
  namespace: dist-system
spec:
  clusterIP: None
  selector:
    app: dist-kvs
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dist-node
  namespace: dist-system
spec:
  serviceName: dist-kvs
  replicas: 3
  selector:
    matchLabels:
      app: dist-kvs
  template:
    metadata:
      labels:
        app: dist-kvs
    spec:
      containers:
        - name: kvs
          image: localhost/dist-node:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ "$POD_NAME" = "dist-node-0" ]; then
                ROLE="Primary"
              else
                ROLE="Backup"
              fi
              PEERS="dist-node-0.dist-kvs:8000,dist-node-1.dist-kvs:8000,dist-node-2.dist-kvs:8000"
              /app/node -id "$POD_NAME" -addr "${POD_NAME}.dist-kvs:8000" -peers "$PEERS" -role "$ROLE"
          ports:
            - containerPort: 8000
